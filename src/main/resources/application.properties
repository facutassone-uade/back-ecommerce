# Datasource (conexión básica)

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=UTC

#usuario y contraseña de la db
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update 

spring.jpa.show-sql=true 
# Muestra en la consola las sentencias SQL generadas por Hibernate. (en desarrollo)


spring.jpa.properties.hibernate.format_sql=true
# Formatea el SQL para mejor legibilidad

# Hibernate 6+ autodetecta el dialecto según la conexión JDBC, no hace falta declararlo a mano.

# JWT (clave HS256 en base64, 256 bits, generada para este TP)
app.jwt.secret=1gc5keXQWreSCngL54Cet7fw8VKQhffx2nW4V0nPk4o=
app.jwt.expiration-ms=86400000

# Admin único (se crea automáticamente al arrancar si no existe, ver AdminSeeder)
app.admin.email=admin@ecommerce.com
app.admin.password=admin123

