# Development Profile - H2 In-Memory Database

# H2 Database Configuration (resets when app stops)
spring.datasource.url=jdbc:h2:mem:ecommerce_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
security.jwt.secret=MyDevelopmentSecretKeyThatIsAtLeast32CharactersLongForJWT
security.jwt.expiration-ms=3600000

